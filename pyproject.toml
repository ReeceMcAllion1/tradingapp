[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "1.0.0"
description = "An automated trading system that charges itself honest costs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
